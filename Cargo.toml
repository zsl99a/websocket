[package]
name = "websocket"
version = "0.1.0"
edition = "2024"
authors = ["zsl99a <zsl99a@gmail.com>"]
license = "MIT"
repository = "https://github.com/zsl99a/websocket"
description = "基于 Rust 与 Tokio 的企业级高可靠异步 WebSocket 客户端框架，支持指数退避重连、心跳保活、事件总线与消息类型路由"
keywords = ["websocket", "tokio", "async", "tungstenite", "client"]
categories = ["network-programming", "asynchronous", "web-programming::websocket"]

[dependencies]
anyhow = "1"

futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

tracing = "0.1"
tracing-subscriber = "0.3"
