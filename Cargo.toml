[package]
name = "websocket"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"

futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

tracing = "0.1"
tracing-subscriber = "0.3"
